  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .image-list {
      /* 防止任何行内空白符造成的间隙 */
      font-size: 0;
    }

    .image-list img {
      display: block;          /* 块级元素，独占一行 */
      width: 800px;            /* 固定宽度 */
      margin: 0 auto;          /* 水平居中 */
      padding: 0;
      border: none;
      line-height: 0;          /* 彻底消除行高影响 */
      vertical-align: top;     /* 虽然 block 下无影响，但保留以防修改 */
    }
    .image-list a {
  display: block;
  width: 300px;              /* 按钮宽度，可按需调整 */
  margin: 40px auto;         /* 上下间距30px，左右自动居中 */
  padding: 12px 0;           /* 上下内边距，让按钮有高度 */
  background-color: #000000; /* 背景色，可换成您喜欢的颜色 */
  color: #ffffff;               /* 文字白色 */
  text-align: center;
  text-decoration: none;     /* 去掉下划线 */
  font-size: 30px;
  border-radius: 6px;        /* 圆角 */
  transition: background-color 0.3s;
}

/* 鼠标悬停时颜色加深 */
.image-list a:hover {
  background-color: #357abd;
}
  }
  
  </style>
